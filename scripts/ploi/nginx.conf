# The admin panel's site, e.g. admin.example.com. In Ploi: Site > Manage > Edit NGINX
# configuration. Keep Ploi's server block, its SSL lines and its "include" lines, and replace its
# "root" line and "location / { ... }" block with what is below.
#
# Passkeys need HTTPS, so issue a certificate in the site's SSL tab first.

# 1. Serve the built panel. Point the root at dist/ inside the site directory.
root /home/ploi/admin.example.com/dist;
index index.html;

# The panel is a single-page app: every path that is not a file is the app. This must be the
# site's only "location /": delete Ploi's own (try_files ... /index.php or =404), or opening
# /login directly gives a 404. Check with: sudo nginx -t
location / {
    try_files $uri /index.html;
}

# Built files are named after their contents, so they can be cached for good.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
}

# 2. The admin API, on the panel's own origin. Turbo listens on loopback (TURBO_ADMIN_URL).
#    If Turbo runs on another server, put its private address here instead, and set its
#    TURBO_ADMIN_URL to listen there.
location /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    # Turbo rate-limits sign-in by client address and trusts this header from loopback only.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The live stream (/api/live) turns buffering off itself and sends a keep-alive every 25s,
    # inside this timeout.
    proxy_read_timeout 60s;

    # Turbo caps every request itself and says which limit was hit: a catalog picture 4 MB, a plugin
    # 16 MB, an asset bundle 64 MB, the two packet logs 256 MB each, anything else 30 MB. This is
    # the largest of those, so nginx never answers a bare 413 first (a hotel view pulled from Habbo
    # saves ~360 KB, a picture is often over 100 KB). Bodies go on as they arrive instead of being
    # written to disk first, so Turbo refuses one it won't take before it is all sent.
    client_max_body_size 513m;
    proxy_request_buffering off;
}

# 3. Behind Cloudflare: $remote_addr is a Cloudflare server, which would put every staff member
#    in one rate-limit bucket, and the site would still answer anyone who finds the server's own
#    address. Both are set up outside this file, in Ploi's per-site include folder and in
#    /etc/nginx/conf.d: see docs/cloudflare.md in turbo-cloud.

# 4. A panel that can ban players should not be framed, sniffed or leak its address.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
